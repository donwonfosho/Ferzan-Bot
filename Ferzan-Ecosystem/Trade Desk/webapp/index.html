<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ferzan Desk</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-secondary-bg-color, #f3f4f6));
    --sunk: var(--tg-theme-secondary-bg-color, #eef0f3);
    --ink: var(--tg-theme-text-color, #111827);
    --muted: var(--tg-theme-hint-color, #6b7280);
    --link: var(--tg-theme-link-color, #2563eb);
    --btn: var(--tg-theme-button-color, #2563eb);
    --btn-ink: var(--tg-theme-button-text-color, #ffffff);
    --gain: #15803d;
    --loss: #c2410c;
    --line: color-mix(in srgb, var(--ink) 10%, transparent);
  }
  /* Dark fallbacks mirror the light ones; inside Telegram the --tg-theme-*
     values win anyway, but the page must stay legible without them. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--tg-theme-bg-color, #111418);
      --card: var(--tg-theme-section-bg-color, var(--tg-theme-secondary-bg-color, #1c2127));
      --sunk: var(--tg-theme-secondary-bg-color, #232a31);
      --ink: var(--tg-theme-text-color, #eef1f4);
      --muted: var(--tg-theme-hint-color, #98a2ad);
      --link: var(--tg-theme-link-color, #6ab3f3);
      --gain: #4ade80; --loss: #fb923c;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--tg-theme-bg-color, #111418);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-secondary-bg-color, #1c2127));
    --sunk: var(--tg-theme-secondary-bg-color, #232a31);
    --ink: var(--tg-theme-text-color, #eef1f4);
    --muted: var(--tg-theme-hint-color, #98a2ad);
    --link: var(--tg-theme-link-color, #6ab3f3);
    --gain: #4ade80; --loss: #fb923c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .wallet-chip {
    display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 999px;
    background: var(--sunk); color: var(--ink); font-weight: 600; font-size: 13px; border: 0;
  }
  .refresh { background: none; border: 0; color: var(--link); font-size: 14px; font-weight: 600; padding: 6px 0; }
  .hero-label { color: var(--muted); font-size: 13px; margin: 0 0 2px; }
  .hero { font-size: 38px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .pnl { display: inline-flex; gap: 4px; align-items: center; font-weight: 600; font-size: 14px; margin-top: 4px; }
  .up { color: var(--gain); } .down { color: var(--loss); } .flat { color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 20px 0 24px; }
  .tile { background: var(--card); border-radius: 14px; padding: 12px; min-width: 0; }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .v { font-weight: 700; font-size: 16px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .s { color: var(--muted); font-size: 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .list { background: var(--card); border-radius: 14px; overflow: hidden; }
  .pos { width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit;
         display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .pos:first-child { border-top: 0; }
  .pos .sym { font-weight: 700; }
  .pos .chain { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--sunk); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
  .pos .val { font-weight: 700; text-align: right; }
  .pos .sub { color: var(--muted); font-size: 12px; }
  .pos .right-sub { font-size: 12px; text-align: right; font-weight: 600; }
  .actions { display: none; grid-column: 1 / -1; gap: 8px; margin-top: 10px; }
  .pos.open .actions { display: flex; flex-direction: column; }
  .arow { display: flex; gap: 8px; }
  .act { flex: 1; border: 0; border-radius: 10px; padding: 10px 6px; font-weight: 700; font-size: 13px; text-align: center; white-space: nowrap; }
  .act.primary { background: var(--btn); color: var(--btn-ink); }
  .act.ghost { background: var(--sunk); color: var(--ink); }
  .empty, .error { background: var(--card); border-radius: 14px; padding: 20px; text-align: center; color: var(--muted); }
  .error { color: var(--loss); }
  .wallets { margin-top: 24px; }
  .w { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 14px; border: 0; border-top: 1px solid var(--line);
       font: inherit; font-size: 14px; color: inherit; background: none; text-align: left; }
  .w .hint { color: var(--link); font-size: 12px; font-weight: 600; margin-left: 6px; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 15; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 16; background: var(--bg); border-radius: 18px 18px 0 0;
           padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 88vh; overflow: auto; box-shadow: 0 -8px 30px rgba(0,0,0,.2); }
  .sheet[hidden], .sheet-bg[hidden] { display: none; }
  .sheet .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .sheet .top b { font-size: 18px; }
  .sheet .x { background: var(--sunk); border: 0; border-radius: 999px; width: 32px; height: 32px; font-size: 16px; color: var(--ink); }
  .sheet .px { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .sec { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
  .sec h3 { font-size: 15px; margin: 0 0 2px; }
  .sec .why { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  .field { display: grid; grid-template-columns: 1fr 110px; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 14px; }
  .field input, .field select { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px;
                                padding: 9px 10px; font: inherit; font-size: 15px; text-align: right; }
  .btnrow { display: flex; gap: 8px; margin-top: 4px; }
  .btnrow .btn { flex: 1; }
  .btn.ghost { background: var(--sunk); color: var(--ink); }
  .armed { font-size: 13px; background: var(--sunk); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; display: flex;
           justify-content: space-between; align-items: center; gap: 8px; }
  .armed button { border: 0; background: none; color: var(--loss); font-weight: 700; font: inherit; font-size: 13px; }
  .w:first-child { border-top: 0; }
  .w code { color: var(--muted); font-size: 12px; }
  .foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }
  .trade { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 24px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
               border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px; }
  .btn { border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 700; font-size: 14px; background: var(--btn); color: var(--btn-ink); }
  .btn:disabled, .act[aria-disabled="true"] { opacity: .5; }
  .tok { margin-top: 12px; }
  .tok .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .tok .name { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tok .chain { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--sunk); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
  .tok .stats { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
  .tok .safety { font-size: 12px; white-space: pre-line; background: var(--sunk); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--bg);
           border-radius: 12px; padding: 12px 14px; font-size: 14px; white-space: pre-line; display: none; z-index: 10; max-height: 40vh; overflow: auto; }
  .toast.show { display: block; }
  .chooser { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column;
             justify-content: center; gap: 12px; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
  .chooser[hidden] { display: none; }
  .chooser h1 { font-size: 22px; margin: 0; text-align: center; }
  .chooser p { color: var(--muted); text-align: center; margin: 0 0 8px; font-size: 14px; }
  .choice { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card);
            color: var(--ink); border-radius: 14px; padding: 16px; font: inherit; cursor: pointer; }
  .choice b { display: block; font-size: 17px; margin-bottom: 2px; }
  .choice span { color: var(--muted); font-size: 13px; }
  .choice.primary { background: var(--btn); color: var(--tg-theme-button-text-color, #fff); border-color: transparent; }
  .choice.primary span { color: inherit; opacity: .85; }
  .remember { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 0; border-radius: 999px; padding: 6px 10px; font: inherit; font-size: 12px; font-weight: 700;
          background: var(--sunk); color: var(--ink); }
  .chip.on { background: color-mix(in srgb, var(--gain) 18%, var(--sunk)); color: var(--gain); }
  .chip.del { color: var(--loss); }
  .wrow { padding: 12px 14px; border-top: 1px solid var(--line); }
  .wrow:first-child { border-top: 0; }
  .wrow .t { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .wrow code { color: var(--muted); font-size: 12px; }
  .master { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; margin-bottom: 10px; }
  .addw { display: grid; grid-template-columns: 1fr 84px; gap: 8px; margin-top: 10px; }
  .addw input, .addw select { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px;
                              padding: 10px 12px; font: inherit; font-size: 14px; min-width: 0; }
  .addw .full { grid-column: 1 / -1; }
  .skeleton { background: var(--sunk); border-radius: 8px; height: 1em; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
</style>
</head>
<body>
<div class="chooser" id="chooser" hidden role="dialog" aria-labelledby="chooserTitle">
  <h1 id="chooserTitle">⚡ Ferzan</h1>
  <p>How do you want to trade?</p>
  <button class="choice primary" id="pickApp"><b>📱 Open the app</b><span>Portfolio, one-tap buys and sells</span></button>
  <button class="choice" id="pickClassic"><b>💬 Classic</b><span>Back to the chat — buttons and /commands</span></button>
  <label class="remember"><input type="checkbox" id="rememberApp"> Always open the app</label>
</div>
<header>
  <button class="wallet-chip" id="walletChip" aria-label="Active wallet">👛 <span id="walletName">…</span></button>
  <button class="refresh" id="refresh">↻ Refresh</button>
</header>

<p class="hero-label">Desk value</p>
<p class="hero num" id="total"><span class="skeleton" style="display:inline-block;width:160px;height:36px"></span></p>
<div class="pnl num" id="pnl"></div>

<div class="tiles">
  <div class="tile"><div class="k">🟣 SOL</div><div class="v num" id="sol">–</div><div class="s num" id="solUsd"></div></div>
  <div class="tile"><div class="k">🔵 ETH · Base</div><div class="v num" id="eth">–</div><div class="s num" id="ethUsd"></div></div>
  <div class="tile"><div class="k">📊 Positions</div><div class="v num" id="npos">–</div><div class="s">open bags</div></div>
</div>

<h2>Trade</h2>
<div class="trade">
  <form class="row" id="findForm" autocomplete="off">
    <input id="ca" placeholder="Paste a token address" aria-label="Token address" spellcheck="false">
    <button class="btn" id="findBtn" type="submit">Find</button>
  </form>
  <div class="tok" id="tok" hidden></div>
</div>

<h2>Positions</h2>
<div id="positions" class="list" role="list"></div>

<h2 style="margin-top:24px">Alerts</h2>
<div id="alerts" class="list"><div class="empty">Loading…</div></div>

<h2 style="margin-top:24px">Tracked wallets · copy</h2>
<div class="trade" id="tracker">
  <div class="master"><span id="copyLiveTxt">Live copy-mirror</span><button class="chip" id="copyLive">…</button></div>
  <div id="twallets" class="list"></div>
  <form class="addw" id="addWallet" autocomplete="off">
    <input class="full" id="twAddr" placeholder="Wallet address to track" spellcheck="false" aria-label="Wallet address">
    <input id="twLabel" placeholder="Label (optional)" maxlength="24" aria-label="Label">
    <select id="twChain" aria-label="Chain"><option value="sol">SOL</option><option value="eth">ETH</option><option value="base">Base</option><option value="bsc">BSC</option><option value="arb">Arb</option></select>
    <button class="btn full" type="submit">📍 Track wallet</button>
  </form>
</div>

<div class="wallets">
  <h2>Wallets</h2>
  <div id="wallets" class="list"></div>
</div>

<p class="foot" id="foot">Trades run through the bot — same safety checks as a button tap.</p>
<p class="foot"><a href="#" id="toClassic">💬 Switch to classic chat mode</a></p>
<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-labelledby="sheetTitle">
  <div class="top"><b id="sheetTitle">Rules</b><button class="x" id="sheetClose" aria-label="Close">✕</button></div>
  <p class="px num" id="sheetPx"></p>
  <div id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const $ = (id) => document.getElementById(id);
  let data = null, bot = "";

  if (tg) {
    tg.ready(); tg.expand();
    document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
    tg.onEvent("themeChanged", () => { document.documentElement.dataset.theme = tg.colorScheme; });
  }

  const usd = (v) => v == null ? "—" : (Math.abs(v) >= 1000
      ? "$" + v.toLocaleString(undefined, { maximumFractionDigits: 0 })
      : "$" + v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
  const amt = (v) => v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : v >= 1e3 ? (v / 1e3).toFixed(2) + "K"
      : v >= 1 ? v.toFixed(2) : v.toPrecision(3);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Gain/loss never relies on color alone: sign + arrow + color.
  const delta = (v, pct) => {
    if (v == null) return `<span class="flat">no cost basis</span>`;
    const cls = v > 0 ? "up" : v < 0 ? "down" : "flat";
    const arrow = v > 0 ? "▲" : v < 0 ? "▼" : "•";
    const p = pct == null ? "" : ` (${pct > 0 ? "+" : ""}${pct.toFixed(1)}%)`;
    return `<span class="${cls}">${arrow} ${v > 0 ? "+" : v < 0 ? "−" : ""}${usd(Math.abs(v))}${p}</span>`;
  };
  const chg = (v) => v == null ? "" : `<span class="${v > 0 ? "up" : v < 0 ? "down" : "flat"}">${v > 0 ? "▲ +" : v < 0 ? "▼ " : ""}${v.toFixed(1)}% 24h</span>`;

  function openBot(param) {
    const url = `https://t.me/${bot}?start=${encodeURIComponent(param)}`;
    if (tg && tg.openTelegramLink) { tg.openTelegramLink(url); tg.close(); } else { location.href = url; }
  }
  function openLink(url) { if (tg && tg.openLink) tg.openLink(url); else window.open(url, "_blank"); }

  function render(d) {
    data = d; bot = d.bot || "";
    const active = (d.wallets || []).find((w) => w.active);
    $("walletName").textContent = active ? active.label : "Wallet";
    $("total").textContent = usd(d.total_usd);
    $("pnl").innerHTML = d.pnl_usd == null ? "" : delta(d.pnl_usd, null) + ` <span class="flat">on tracked buys</span>`;
    $("sol").textContent = d.balances.sol.toFixed(4);
    $("solUsd").textContent = d.balances.sol_usd == null ? "" : usd(d.balances.sol_usd);
    $("eth").textContent = d.balances.eth_base.toFixed(5);
    $("ethUsd").textContent = d.balances.eth_usd == null ? "" : usd(d.balances.eth_usd);
    $("npos").textContent = String(d.positions.length);

    const box = $("positions");
    if (!d.positions.length) {
      box.className = "empty";
      box.innerHTML = "No open bags yet.<br>Paste a token address in the bot to make your first buy.";
    } else {
      box.className = "list";
      box.innerHTML = d.positions.map((p, i) => `
        <button class="pos" role="listitem" data-i="${i}" aria-expanded="false">
          <div><span class="sym">$${esc(p.symbol)}</span><span class="chain">${esc(p.chain)}</span></div>
          <div class="val num">${p.priced ? usd(p.value) : "unpriced"}</div>
          <div class="sub num">${amt(p.amount)} · ${chg(p.chg24)}</div>
          <div class="right-sub num">${delta(p.pnl, p.pnl_pct)}</div>
          <div class="actions">
            <div class="arow">${sellPcts().map((v) => `<span class="act primary" data-sellpct="${v}" data-mint="${esc(p.mint)}" data-sym="${esc(p.symbol)}">Sell ${v}%</span>`).join("")}</div>
            <div class="arow">
              <span class="act ghost" data-rules="${esc(p.mint)}" data-sym="${esc(p.symbol)}" data-px="${p.price || 0}">⚙️ Rules</span>
              ${p.pnl != null ? `<span class="act ghost" data-card="${esc(p.mint)}">📸 Card</span>` : ""}
              ${p.chart ? `<span class="act ghost" data-chart="${esc(p.chart)}">📈 Chart</span>` : ""}
              <span class="act ghost" data-sell="${esc(p.mint)}">💬 Bot</span>
            </div>
          </div>
        </button>`).join("");
    }
    const ws = d.wallets || [];
    $("wallets").innerHTML = ws.map((w) => `
      <button class="w" data-wallet="${w.id}" data-label="${esc(w.label)}" ${w.active ? 'aria-current="true"' : ""}>
        <span>${w.active ? "✅" : "▫️"} ${esc(w.label)}${!w.active && ws.length > 1 ? '<span class="hint">Switch</span>' : ""}</span>
        <code>${esc(w.sol.slice(0, 4))}…${esc(w.sol.slice(-4))}</code></button>`).join("");
    $("foot").textContent = `Updated ${new Date(d.ts * 1000).toLocaleTimeString()} · trades run through the bot`;
  }

  $("positions").addEventListener("click", (e) => {
    const sp = e.target.closest("[data-sellpct]");
    if (sp) { order({ side: "sell", mint: sp.dataset.mint, amount: +sp.dataset.sellpct, unit: "pct" },
                    `Sell ${sp.dataset.sellpct}% of $${sp.dataset.sym}?`); return; }
    const ru = e.target.closest("[data-rules]");
    if (ru) { openRules(ru.dataset.rules, ru.dataset.sym, +ru.dataset.px); return; }
    const cd = e.target.closest("[data-card]");
    if (cd) { sendCard(cd.dataset.card); return; }
    const sell = e.target.closest("[data-sell]");
    if (sell) { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred("medium"); openBot("sell_" + sell.dataset.sell); return; }
    const chart = e.target.closest("[data-chart]");
    if (chart) { openLink(chart.dataset.chart); return; }
    const row = e.target.closest(".pos");
    if (row) { row.classList.toggle("open"); row.setAttribute("aria-expanded", row.classList.contains("open")); }
  });
  $("walletChip").addEventListener("click", () => bot && openBot("wallets"));

  const sellPcts = () => {
    const s = (data && data.presets && data.presets.sell) || [25, 50];
    return [...s.filter((v) => v < 100), 100];
  };
  function toast(msg, ms) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); if (ms) toast._t = setTimeout(() => t.classList.remove("show"), ms);
  }
  $("toast").addEventListener("click", () => $("toast").classList.remove("show"));
  const confirmBox = (msg) => new Promise((res) => {
    if (tg && tg.showConfirm) tg.showConfirm(msg, (ok) => res(!!ok)); else res(window.confirm(msg));
  });
  async function api(path, body) {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: tg ? tg.initData : "", ...body }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || "Request failed");
    return j;
  }
  let busy = false;
  async function order(o, question) {
    if (busy) { toast("A trade is already running…", 2500); return; }
    if (!(await confirmBox(question))) return;
    busy = true; document.body.classList.add("busy");
    tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred("medium");
    toast("⏳ Sending…");
    try {
      const { id } = await api("/api/order", o);
      const started = Date.now();
      let misses = 0;
      // A landing can take a minute+ (Jito try, then the fallback route), so
      // show a live timer instead of a frozen "Sending…".
      while (Date.now() - started < 240000) {
        await new Promise((r) => setTimeout(r, 1500));
        const secs = Math.round((Date.now() - started) / 1000);
        let st;
        try { st = await api("/api/order/status", { id }); misses = 0; }
        catch (e) {  // one dropped poll must not end the wait: the trade is still running
          if (++misses >= 8) throw e;
          continue;
        }
        if (["done", "failed", "expired"].includes(st.status)) {
          const ok = st.status === "done";
          tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(ok ? "success" : "error");
          // Stays up until tapped, so a result that lands while you look away isn't missed.
          toast((st.result || (ok ? "✅ Done" : "🔴 Failed")) + "\n\nTap to close", 0);
          load(true);
          return;
        }
        toast(st.status === "running" ? `⏳ Landing on-chain… ${secs}s` : `⏳ Queued… ${secs}s`);
      }
      toast("⏳ Still working — the result will show in the bot chat.\n\nTap to close", 0);
    } catch (err) {
      toast("🔴 " + (err.message || "Couldn't send"), 0);
    } finally { busy = false; document.body.classList.remove("busy"); }
  }
  let token = null;
  $("findForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const mint = $("ca").value.trim();
    if (!mint) return;
    $("findBtn").disabled = true; $("findBtn").textContent = "…";
    const box = $("tok"); box.hidden = false;
    box.innerHTML = `<div class="skeleton" style="height:48px"></div>`;
    try {
      token = await api("/api/token", { mint });
      const t = token;
      box.innerHTML = `
        <div class="head"><span class="name">$${esc(t.symbol)} <span class="chain">${esc((t.chain || "").toUpperCase())}</span></span>
          <span class="num">${t.price ? "$" + Number(t.price).toPrecision(4) : ""}</span></div>
        <div class="stats num">MC ${usd(t.mc)} · Liq ${usd(t.liq)} · ${chg(t.chg24)}</div>
        ${t.safety ? `<div class="safety">${esc(t.safety)}</div>` : ""}
        <div class="grid3">${(t.presets || []).map((v) =>
          `<button class="btn" data-buy="${v}">Buy ${v} ${esc(t.unit)}</button>`).join("")}</div>
        ${(data && data.multi >= 2) ? `<label class="remember" style="justify-content:flex-start;margin:8px 0 0"><input type="checkbox" id="multiBuy" checked> 👥 Buy in all ${data.multi} multi-buy wallets</label>` : ""}
        <form class="row" id="alertForm" style="margin-top:8px" autocomplete="off">
          <input id="alertTarget" placeholder="🔔 Alert at 2m, +50%, price 0.0012" aria-label="Alert target">
          <button class="btn ghost" type="submit">Set</button></form>
        <div class="btnrow" style="margin-top:8px"><button class="btn ghost" data-rules="${esc(t.mint)}" data-sym="${esc(t.symbol)}" data-px="${t.price || 0}">⏳ Limit buy · 📅 DCA</button></div>
        ${t.chart ? `<p style="margin:10px 0 0"><a href="#" data-chart="${esc(t.chart)}" style="color:var(--link)">Open chart ↗</a></p>` : ""}`;
    } catch (err) {
      box.innerHTML = `<div class="error" style="padding:12px">${esc(err.message)}</div>`;
    } finally { $("findBtn").disabled = false; $("findBtn").textContent = "Find"; }
  });
  $("tok").addEventListener("click", (e) => {
    const b = e.target.closest("[data-buy]");
    if (b && token) {
      const n = +b.dataset.buy, px = token.native_usd || 0, cap = token.max_usd || 0;
      const mb = $("multiBuy"), wallets = mb && mb.checked ? (data.multi || 1) : 1;
      let q = `Buy ${n} ${token.unit} of $${token.symbol}`;
      if (px) {
        const v = Math.min(n * px, cap || Infinity);
        q += cap && n * px > cap ? ` (≈ $${cap.toFixed(0)} — capped per trade)` : ` (≈ $${v.toFixed(2)})`;
        if (wallets > 1) {
          const total = v * wallets;
          q += cap && total > cap
            ? ` in ${wallets} wallets — capped at $${cap.toFixed(0)} total (≈ $${(cap / wallets).toFixed(2)} each)`
            : ` in each of ${wallets} wallets — about $${total.toFixed(2)} total`;
        }
      } else if (wallets > 1) q += ` in each of ${wallets} wallets`;
      order({ side: "buy", mint: token.mint, chain: token.chain, amount: n, unit: "native", multi: wallets > 1 }, q + "?");
      return;
    }
    const ru = e.target.closest("[data-rules]");
    if (ru) { openRules(ru.dataset.rules, ru.dataset.sym, +ru.dataset.px); return; }
    const c = e.target.closest("[data-chart]");
    if (c) { e.preventDefault(); openLink(c.dataset.chart); }
  });

  // ---- wallets: tap one to make it the active wallet --------------------
  $("wallets").addEventListener("click", async (e) => {
    const w = e.target.closest("[data-wallet]");
    if (!w || w.getAttribute("aria-current") === "true") return;
    if (!(await confirmBox(`Switch to "${w.dataset.label}"? Trades and balances will use that wallet.`))) return;
    try {
      await api("/api/wallet", { id: +w.dataset.wallet });
      tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
      toast(`✅ Now trading from ${w.dataset.label}`, 3000);
      load(true);
    } catch (err) { toast("🔴 " + err.message, 4000); }
  });

  // ---- PnL card: the bot renders it and sends it to your chat -----------
  async function sendCard(mint) {
    try {
      await api("/api/card", { mint });
      toast("📸 Card on its way to your chat — forward it anywhere.", 4000);
    } catch (err) { toast("🔴 " + err.message, 4000); }
  }

  // ---- rules sheet: exit rules, limit buys, DCA -------------------------
  const px = (v) => !v ? "" : v >= 1 ? v.toFixed(4) : Number(v).toPrecision(4);
  let sheetMint = null, sheetSym = "", sheetPx = 0;
  function closeSheet() { $("sheet").hidden = true; $("sheetBg").hidden = true; sheetMint = null; }
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheetBg").addEventListener("click", closeSheet);
  async function openRules(mint, sym, price) {
    sheetMint = mint; sheetSym = sym || "TOKEN"; sheetPx = price || 0;
    $("sheetTitle").textContent = `$${sheetSym}`;
    $("sheetPx").textContent = sheetPx ? `Now $${px(sheetPx)}` : "";
    $("sheetBody").innerHTML = `<div class="skeleton" style="height:120px"></div>`;
    $("sheet").hidden = false; $("sheetBg").hidden = false;
    try { renderRules(await api("/api/rules", { mint })); }
    catch (err) { $("sheetBody").innerHTML = `<div class="error">${esc(err.message)}</div>`; }
  }
  const val = (v) => v == null ? "" : String(v);
  function renderRules(r) {
    const ex = r.exit || {};
    const exitSec = r.has_cost ? `
      <div class="sec"><h3>🎯 Exit rules</h3>
        <p class="why">Sells the whole bag automatically. Leave a box empty to turn that rule off.</p>
        <label class="field">Take profit at +%<input id="rTp" inputmode="decimal" placeholder="off" value="${val(ex.tp)}"></label>
        <label class="field">Stop loss at −%<input id="rSl" inputmode="decimal" placeholder="off" value="${val(ex.sl)}"></label>
        <label class="field">Trailing stop %<input id="rTr" inputmode="decimal" placeholder="off" value="${val(ex.trail)}"></label>
        <div class="btnrow"><button class="btn" data-save="exit">Save exits</button>
          ${r.exit ? `<button class="btn ghost" data-save="exit_clear">Clear</button>` : ""}</div>
      </div>` : `
      <div class="sec"><h3>🎯 Exit rules</h3><p class="why" style="margin:0">Buy through Ferzan first — exits need the price you paid.</p></div>`;
    const limits = (r.limits || []).map((l) => `
      <div class="armed num"><span>Buy $${l.usd.toFixed(0)} at $${px(l.target_px)}</span><button data-cancel="${l.id}">Cancel</button></div>`).join("");
    const limitSec = `
      <div class="sec"><h3>⏳ Limit buy</h3>
        <p class="why">Buys when the price drops to your target. Checked about every 35s.</p>
        ${limits}
        <label class="field">Target price $<input id="rLpx" inputmode="decimal" placeholder="${sheetPx ? px(sheetPx * 0.8) : "0.0001"}"></label>
        <label class="field">Spend $ (max ${r.max_usd.toFixed(0)})<input id="rLusd" inputmode="decimal" value="${Math.min(10, r.max_usd)}"></label>
        <div class="btnrow"><button class="btn" data-save="limit">Arm limit buy</button></div>
      </div>`;
    const d = r.dca;
    const dcaSec = `
      <div class="sec"><h3>📅 DCA</h3>
        <p class="why">Buys a fixed amount on a schedule, with the same safety checks as any buy.</p>
        ${d ? `<div class="armed num"><span>$${d.usd.toFixed(0)} ${esc(d.every || "")} · next in ${Math.max(1, Math.round(d.next_in / 60))}m</span><button data-save="dca_off">Stop</button></div>` : ""}
        <label class="field">Spend $ each time<input id="rDusd" inputmode="decimal" value="${d ? d.usd : Math.min(10, r.max_usd)}"></label>
        <label class="field">How often<select id="rDev">
          ${["hourly", "daily", "weekly"].map((k) => `<option value="${k}" ${(d ? d.every : "daily") === k ? "selected" : ""}>${k}</option>`).join("")}
        </select></label>
        <div class="btnrow"><button class="btn" data-save="dca">${d ? "Update DCA" : "Start DCA"}</button></div>
      </div>`;
    $("sheetBody").innerHTML = exitSec + limitSec + dcaSec;
  }
  $("sheetBody").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-save], [data-cancel]");
    if (!b || !sheetMint) return;
    const v = (id) => { const x = $(id); return x && x.value.trim() !== "" ? x.value.trim() : null; };
    let body = { mint: sheetMint }, msg = "Saved";
    if (b.dataset.cancel) { body = { ...body, kind: "limit_cancel", id: +b.dataset.cancel }; msg = "Limit cancelled"; }
    else {
      const k = b.dataset.save;
      if (k === "exit") { body = { ...body, kind: "exit", tp: v("rTp"), sl: v("rSl"), trail: v("rTr") }; msg = "✅ Exit rules saved"; }
      else if (k === "exit_clear") { body = { ...body, kind: "exit" }; msg = "Exit rules cleared"; }
      else if (k === "limit") {
        const t = v("rLpx"), u = v("rLusd");
        if (!t || !u) { toast("Enter a target price and an amount.", 3000); return; }
        if (sheetPx && +t >= sheetPx && !(await confirmBox(`$${px(+t)} is at or above the current price — it will buy right away. Arm it anyway?`))) return;
        body = { ...body, kind: "limit", target_px: t, usd: u }; msg = "⏳ Limit buy armed";
      }
      else if (k === "dca") {
        const u = v("rDusd"), ev = $("rDev").value;
        if (!(await confirmBox(`Buy $${u} of $${sheetSym} ${ev}, until you stop it?`))) return;
        body = { ...body, kind: "dca", usd: u, every: ev }; msg = "📅 DCA started";
      }
      else if (k === "dca_off") { body = { ...body, kind: "dca_off" }; msg = "DCA stopped"; }
    }
    b.disabled = true;
    try {
      renderRules(await api("/api/rules/save", body));
      tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
      toast(msg, 2500);
    } catch (err) { toast("🔴 " + err.message, 4000); b.disabled = false; }
  });

  let inflight = false;
  async function load(refresh) {
    if (inflight) return; inflight = true;
    $("refresh").textContent = "…";
    try {
      const r = await fetch("/api/portfolio", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData: tg ? tg.initData : "", refresh: !!refresh }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || "Couldn't load");
      render(j);
    } catch (err) {
      $("positions").className = "error";
      $("positions").textContent = err.message || "Couldn't load your desk.";
      $("total").textContent = data ? usd(data.total_usd) : "—";
    } finally {
      inflight = false; $("refresh").textContent = "↻ Refresh";
    }
  }
  $("refresh").addEventListener("click", () => load(true));

  // ---- alerts + tracked wallets / copy-trade -----------------------------
  const fmtMc = (v) => v >= 1e9 ? `$${(v / 1e9).toFixed(2)}B` : v >= 1e6 ? `$${(v / 1e6).toFixed(2)}M` : v >= 1e3 ? `$${(v / 1e3).toFixed(1)}K` : `$${v.toFixed(0)}`;
  let watch = null;
  function renderWatch(w) {
    watch = w;
    const al = $("alerts");
    if (!w.alerts.length) { al.className = "empty"; al.innerHTML = "No alerts yet.<br>Find a token above and set one — like 2m, +50% or price 0.0012."; }
    else {
      al.className = "list";
      al.innerHTML = w.alerts.map((a) => `
        <div class="armed num" style="margin:0;border-radius:0;background:none;border-top:1px solid var(--line)">
          <span>${a.direction === "above" ? "▲" : "▼"} $${esc(a.symbol || a.mint.slice(0, 6))} ${a.direction} ${a.kind === "mc" ? fmtMc(a.target) + " MC" : "$" + px(a.target)}</span>
          <button data-delalert="${a.id}">Remove</button></div>`).join("");
    }
    $("copyLive").textContent = w.copy_live ? "🟢 ON" : "🔴 OFF";
    $("copyLive").className = "chip" + (w.copy_live ? " on" : "");
    $("copyLiveTxt").innerHTML = `<b>Live copy-mirror</b><br><span class="flat" style="font-size:12px">${w.copy_live ? "Copy-ON wallets are mirrored with real buys" : "Off — tracked wallets only send alerts"}</span>`;
    const tw = $("twallets");
    tw.className = w.wallets.length ? "list" : "";
    tw.innerHTML = w.wallets.map((x) => `
      <div class="wrow"><div class="t"><span><b>${esc(x.label || "Wallet #" + x.id)}</b> <span class="chain" style="font-size:11px;color:var(--muted)">${esc(x.chain.toUpperCase())}</span></span>
        <code>${esc(x.address.slice(0, 4))}…${esc(x.address.slice(-4))}</code></div>
        <div class="chips">
          <button class="chip${x.copy_on ? " on" : ""}" data-copy="${x.id}" data-f="copy_on">${x.copy_on ? "👯 Copy ON" : "👁 Alerts only"}</button>
          <button class="chip" data-copy="${x.id}" data-f="copy_usd">Size ${x.copy_usd ? "$" + x.copy_usd.toFixed(0) : "default"}</button>
          <button class="chip${x.copy_sells ? " on" : ""}" data-copy="${x.id}" data-f="copy_sells">Sells ${x.copy_sells ? "ON" : "OFF"}</button>
          <button class="chip del" data-delwallet="${x.id}" data-label="${esc(x.label || "this wallet")}">Remove</button>
        </div></div>`).join("");
  }
  async function loadWatch() {
    try { renderWatch(await api("/api/watch", {})); }
    catch (err) { $("alerts").className = "error"; $("alerts").textContent = err.message; }
  }
  $("alerts").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-delalert]");
    if (!b) return;
    try { renderWatch(await api("/api/alerts/del", { id: +b.dataset.delalert })); toast("Alert removed", 2000); }
    catch (err) { toast("🔴 " + err.message, 4000); }
  });
  $("tok").addEventListener("submit", async (e) => {
    if (e.target.id !== "alertForm" || !token) return;
    e.preventDefault();
    const t = $("alertTarget").value.trim();
    if (!t) return;
    try {
      renderWatch(await api("/api/alerts/add", { mint: token.mint, target: t }));
      $("alertTarget").value = "";
      toast(`🔔 Alert set for $${token.symbol}`, 2500);
    } catch (err) { toast("🔴 " + err.message, 4000); }
  });
  $("copyLive").addEventListener("click", async () => {
    if (!watch) return;
    const on = !watch.copy_live;
    if (on && !(await confirmBox("Turn on live copy-mirror? Wallets set to Copy ON will trigger REAL buys from your active wallet (same safety checks as any buy)."))) return;
    try { renderWatch(await api("/api/copylive", { on })); toast(on ? "👯 Live copy-mirror ON" : "Copy-mirror off", 2500); }
    catch (err) { toast("🔴 " + err.message, 4000); }
  });
  $("twallets").addEventListener("click", async (e) => {
    const d = e.target.closest("[data-delwallet]");
    if (d) {
      if (!(await confirmBox(`Stop tracking ${d.dataset.label}?`))) return;
      try { renderWatch(await api("/api/wallets/del", { id: +d.dataset.delwallet })); } catch (err) { toast("🔴 " + err.message, 4000); }
      return;
    }
    const c = e.target.closest("[data-copy]");
    if (!c || !watch) return;
    const x = watch.wallets.find((w) => w.id === +c.dataset.copy);
    const f = c.dataset.f, body = { id: x.id };
    if (f === "copy_on") body.copy_on = !x.copy_on;
    else if (f === "copy_sells") body.copy_sells = !x.copy_sells;
    else { const s = watch.copy_sizes, i = s.indexOf(x.copy_usd); body.copy_usd = s[(i + 1) % s.length]; }
    try {
      renderWatch(await api("/api/wallets/copy", body));
      if (f === "copy_on" && body.copy_on && !watch.copy_live) toast("Copy ON — it only buys once Live copy-mirror (above) is ON.", 4000);
    } catch (err) { toast("🔴 " + err.message, 4000); }
  });
  $("addWallet").addEventListener("submit", async (e) => {
    e.preventDefault();
    const address = $("twAddr").value.trim();
    if (!address) return;
    const chain = address.startsWith("0x") ? ($("twChain").value === "sol" ? "eth" : $("twChain").value) : "sol";
    try {
      renderWatch(await api("/api/wallets/add", { address, chain, label: $("twLabel").value.trim() }));
      $("twAddr").value = ""; $("twLabel").value = "";
      toast("📍 Tracking — you'll get a DM when it trades.", 3000);
    } catch (err) { toast("🔴 " + err.message, 4000); }
  });

  // Opened from the chat's menu button: ask app vs classic first (unless the
  // person ticked "Always open the app" on this device).
  const qs = new URLSearchParams(location.search);
  const menuBot = (qs.get("bot") || "").replace(/[^A-Za-z0-9_]/g, "");
  let skipChooser = false;
  try { skipChooser = localStorage.getItem("ferzan_open") === "app"; } catch (e) { /* storage blocked */ }
  $("toClassic").addEventListener("click", (e) => {
    e.preventDefault();
    try { localStorage.removeItem("ferzan_open"); } catch (err) { /* ignore */ }
    const b = bot || menuBot;
    if (b) { bot = b; openBot("home"); } else if (tg) { tg.close(); }
  });
  if (qs.get("from") === "menu" && !skipChooser) {
    $("chooser").hidden = false;
    $("pickApp").addEventListener("click", () => {
      try { if ($("rememberApp").checked) localStorage.setItem("ferzan_open", "app"); } catch (e) { /* ignore */ }
      $("chooser").hidden = true;
    });
    $("pickClassic").addEventListener("click", () => {
      const b = bot || menuBot;
      if (b) { bot = b; openBot("home"); } else if (tg) { tg.close(); }
    });
  }
  load(false);
  loadWatch();
  setInterval(() => { if (!document.hidden) load(false); }, 30000);
})();
</script>
</body>
</html>
