<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Token</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000); padding: 16px; margin: 0; }
  button { width: 100%; padding: 14px; font-size: 16px; border-radius: 10px; border: none;
    margin-top: 12px; cursor: pointer; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  button:disabled { opacity: .55; cursor: default; }
  .primary { background: #f5f5f5; color: #111; border-radius: 8px; font-size: 14px; }
  .wallet-btn { display:flex; align-items:center; justify-content:center; gap:10px; background:#111; color:#fff; font-weight:600; margin-top:8px; }
  #status { margin-top: 16px; padding: 12px; border-radius: 8px; display:none; line-height:1.4; word-break: break-word; }
  #status a { color: inherit; font-weight: 600; }
  .error { background: #fde8e8 !important; color: #a00; }
  .success { background: #e6f7e6 !important; color: #060; }
  .hint { background:#eef4fb !important; color:#1a5591; }
  .detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 14px; border-bottom: 1px solid #eee; }
  .detail-row b { text-align: right; }
  #walletChoices { display:none; margin-top:8px; }
  #walletChoices .sub { font-size: 13px; color: #888; margin: 10px 0 2px; text-align:center; }
  #successScreen { display:none; text-align:center; padding: 40px 16px; }
  #successScreen .check { font-size: 64px; line-height: 1; margin-bottom: 16px; }
  #successScreen h2 { margin: 0 0 12px; }
  #successScreen p { color: #555; font-size: 15px; line-height: 1.5; margin: 0 0 8px; }
  #successScreen .txlink { word-break: break-all; font-size: 12px; color: #888; margin-top: 12px; display:block; }
  #mainContent.hidden { display:none; }
</style>
</head>
<body>
<div id="mainContent">
<h2>Review Your Launch</h2>
<div id="details">Loading launch details...</div>
<div id="status"></div>

<button id="connectBtn" class="primary" style="display:none">Connect Wallet</button>

<div id="walletChoices">
  <div class="sub">Open this launch in your Solana wallet:</div>
  <button class="wallet-btn" data-wallet="phantom">Phantom</button>
  <button class="wallet-btn" data-wallet="solflare">Solflare</button>
  <button class="wallet-btn" data-wallet="trust">Trust Wallet</button>
  <button class="wallet-btn" data-wallet="backpack">Backpack</button>
  <button class="wallet-btn" data-wallet="okx">OKX Wallet</button>
  <button class="wallet-btn" data-wallet="coinbase">Coinbase Wallet</button>
  <button class="wallet-btn" data-wallet="metamask">MetaMask (Solana)</button>
</div>

<button id="signBtn" class="primary" style="display:none">Review & Sign Transaction</button>
</div>

<div id="successScreen">
  <div class="check">✅</div>
  <h2>Launch complete!</h2>
  <p>Your token was created and the transaction was confirmed on-chain.</p>
  <p><strong>You're all done here — you can close this page and go back to Telegram.</strong></p>
  <button id="closeBtn" class="primary">Close this window</button>
  <a id="returnBtn" href="https://t.me/FerzanLaunchBot" style="display:block;text-align:center;margin-top:12px;font-weight:600;color:#2481cc;text-decoration:none;">Return to Telegram</a>
  <a class="txlink" id="txlinkText" target="_blank" rel="noopener"></a>
</div>

<script type="module">
  import { Transaction, VersionedTransaction } from 'https://esm.sh/@solana/web3.js@1?bundle';

  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const params = new URLSearchParams(window.location.search);
  const requestId = params.get('request_id');
  const API_BASE = 'https://launch.ferzaneco.com/api';

  const mainContent = document.getElementById('mainContent');
  const successScreen = document.getElementById('successScreen');
  const closeBtn = document.getElementById('closeBtn');
  const txlinkText = document.getElementById('txlinkText');
  const detailsEl = document.getElementById('details');
  const statusEl = document.getElementById('status');
  const connectBtn = document.getElementById('connectBtn');
  const signBtn = document.getElementById('signBtn');
  const walletChoices = document.getElementById('walletChoices');

  let connectedAddress = null;
  let walletProvider = null;
  let launchReq = null;

  function showStatus(text, kind, html) {
    statusEl.style.display = 'block';
    if (html) statusEl.innerHTML = text; else statusEl.textContent = text;
    statusEl.className = kind || '';
  }

  function solscan(sig) { return `https://solscan.io/tx/${sig}`; }

  function showSuccess(signature) {
    mainContent.classList.add('hidden');
    successScreen.style.display = 'block';
    if (signature) { txlinkText.textContent = `View on Solscan: ${signature}`; txlinkText.href = solscan(signature); }
  }

  closeBtn.addEventListener('click', () => {
    if (tg?.close) tg.close();
    else { try { window.close(); } catch (e) {} }
    setTimeout(() => { window.location.href = 'https://t.me/FerzanLaunchBot'; }, 300);
  });

  function hexToBytes(hex) {
    const raw = String(hex || '').replace(/^0x/i, '');
    const out = new Uint8Array(raw.length / 2);
    for (let i = 0; i < out.length; i++) out[i] = parseInt(raw.substr(i * 2, 2), 16);
    return out;
  }

  function bytesToB64(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }

  const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  function base58(bytes) {
    let n = 0n;
    for (const b of bytes) n = n * 256n + BigInt(b);
    let out = '';
    while (n > 0n) { out = B58[Number(n % 58n)] + out; n = n / 58n; }
    for (const b of bytes) { if (b === 0) out = '1' + out; else break; }
    return out;
  }

  function txBytes(tx) {
    return tx instanceof VersionedTransaction ? tx.serialize() : tx.serialize({ requireAllSignatures: false, verifySignatures: false });
  }

  // ---------- wallet detection ----------
  // 1) wallets that inject a classic provider in their own browser
  function legacyProvider() {
    const w = window;
    const list = [
      ['Phantom', w.phantom?.solana?.isPhantom ? w.phantom.solana : null],
      ['Solflare', w.solflare?.isSolflare ? w.solflare : null],
      ['Backpack', w.backpack?.isBackpack ? w.backpack : null],
      ['OKX Wallet', w.okxwallet?.solana || null],
      ['Trust Wallet', w.trustwallet?.solana || null],
      ['Coinbase Wallet', w.coinbaseSolana || null],
      ['Bitget Wallet', w.bitkeep?.solana || null],
      ['Wallet', w.solana || null],
    ];
    for (const [name, p] of list) if (p && typeof p.connect === 'function') return { name, p, kind: 'legacy' };
    return null;
  }

  // 2) any wallet using the Solana Wallet Standard (MetaMask, Backpack, newer wallets)
  async function standardProvider() {
    try {
      const { getWallets } = await import('https://esm.sh/@wallet-standard/app@1?bundle');
      const api = getWallets();
      const pick = () => api.get().find(w =>
        (w.chains || []).some(c => String(c).startsWith('solana:')) && w.features?.['standard:connect'] &&
        (w.features['solana:signAndSendTransaction'] || w.features['solana:signTransaction']));
      let w = pick();
      if (!w) { await new Promise(r => setTimeout(r, 600)); w = pick(); }
      if (!w) return null;
      let account = null;
      const chain = 'solana:mainnet';
      const p = {
        async connect() {
          const r = await w.features['standard:connect'].connect();
          account = (r?.accounts || w.accounts || [])[0];
          if (!account) throw new Error('No Solana account shared by the wallet');
          return { publicKey: { toString: () => account.address } };
        },
      };
      if (w.features['solana:signAndSendTransaction']) {
        p.signAndSendTransaction = async (tx) => {
          const [r] = await w.features['solana:signAndSendTransaction'].signAndSendTransaction({ account, chain, transaction: txBytes(tx) });
          return { signature: base58(r.signature) };
        };
      }
      if (w.features['solana:signTransaction']) {
        p.signTransaction = async (tx) => {
          const [r] = await w.features['solana:signTransaction'].signTransaction({ account, chain, transaction: txBytes(tx) });
          return r.signedTransaction;
        };
      }
      return { name: w.name, p, kind: 'standard' };
    } catch (e) {
      return null;
    }
  }

  async function detectWallet() {
    return legacyProvider() || (await standardProvider());
  }

  // ---------- open this page inside a wallet's own browser ----------
  function walletLink(id) {
    const url = window.location.href;
    const u = encodeURIComponent(url);
    const ref = encodeURIComponent(window.location.origin);
    switch (id) {
      case 'phantom': return `https://phantom.app/ul/browse/${u}?ref=${ref}`;
      case 'solflare': return `https://solflare.com/ul/v1/browse/${u}?ref=${ref}`;
      case 'trust': return `https://link.trustwallet.com/open_url?coin_id=501&url=${u}`;
      case 'backpack': return `https://backpack.app/ul/v1/browse/${u}?ref=${ref}`;
      case 'okx': return 'https://web3.okx.com/download?deeplink=' + encodeURIComponent('okx://wallet/dapp/url?dappUrl=' + u);
      case 'coinbase': return `https://go.cb-w.com/dapp?cb_url=${u}`;
      case 'metamask': return 'https://metamask.app.link/dapp/' + url.replace(/^https?:\/\//, '');
    }
    return null;
  }

  walletChoices.querySelectorAll('[data-wallet]').forEach(btn => {
    btn.addEventListener('click', () => {
      const link = walletLink(btn.dataset.wallet);
      if (!link) return;
      if (tg?.openLink) tg.openLink(link); else window.open(link, '_blank');
    });
  });

  function showWalletChoices() {
    showStatus('Choose your wallet — this launch opens inside that wallet’s app so it can sign.', 'hint');
    walletChoices.style.display = 'block';
  }

  // ---------- review screen ----------
  function cleanNum(v) { const m = String(v ?? '').replace(/,/g, '').match(/\d*\.\d+|\d+/); return m ? m[0] : ''; }

  async function loadRequest() {
    if (!requestId) {
      detailsEl.textContent = 'Missing request ID -- open this from the bot, not directly.';
      return;
    }
    const res = await fetch(`${API_BASE}/launch-requests/${requestId}`);
    if (!res.ok) {
      detailsEl.textContent = 'Could not load launch details (may have expired).';
      return;
    }
    const req = await res.json();
    launchReq = req;
    const extra = req.extra_params || {};
    const curve = ['meteora', 'pumpfun', 'bonding_curve'].includes(req.mode);
    const dev = cleanNum(extra.dev_buy);
    const rows = [
      ['Name', req.name],
      ['Symbol', req.symbol],
      ['Chain', 'Solana'],
      ['Mode', curve ? 'Bonding curve (Meteora)' : req.mode],
      ['Supply', curve ? '1,000,000,000 (fixed for bonding-curve launches)' : (req.supply_display || req.total_supply)],
    ];
    if (curve) {
      rows.push(['Trading', '1% fee per trade · anti-sniper fee for the first 60s']);
      rows.push(['Graduates', 'to a Meteora pool at ~84 SOL raised, liquidity locked']);
      rows.push(['Dev buy', dev && Number(dev) > 0 ? `${dev} SOL (bought first, same transaction)` : 'None']);
    }
    if (extra.allocs) rows.push(['Team wallets', extra.allocs]);
    rows.push(['Cost', 'Exact total is shown before you sign']);
    detailsEl.innerHTML = rows.map(([k, v]) =>
      `<div class="detail-row"><span>${k}</span><b>${String(v ?? '').replace(/</g, '&lt;').slice(0, 90)}</b></div>`
    ).join('');

    const found = await detectWallet();
    if (found) {
      connectBtn.textContent = `Connect ${found.name}`;
      connectBtn.style.display = 'block';
    } else {
      showWalletChoices();
    }
  }

  connectBtn.addEventListener('click', async () => {
    try {
      const found = await detectWallet();
      if (!found) { showWalletChoices(); return; }
      walletProvider = found.p;
      const resp = await walletProvider.connect();
      connectedAddress = resp?.publicKey?.toString() || walletProvider.publicKey?.toString() || '';
      if (!connectedAddress) throw new Error('the wallet did not share an address');
      showStatus(`Connected: ${connectedAddress}`, 'success');
      connectBtn.style.display = 'none';
      walletChoices.style.display = 'none';
      signBtn.style.display = 'block';
    } catch (e) {
      showStatus(`Wallet connection failed: ${e.message}`, 'error');
    }
  });

  async function api(path, body) {
    const r = await fetch(`${API_BASE}/launch-requests/${requestId}/${path}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}),
    });
    let data = {};
    try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(data.detail || `server error ${r.status}`);
    return data;
  }

  async function waitForConfirm(signature) {
    const until = Date.now() + 90000;
    while (Date.now() < until) {
      await new Promise(r => setTimeout(r, 2000));
      let st;
      try { st = await api('sol-confirm', { signature }); } catch (e) { continue; }
      if (st.status === 'confirmed') return { ok: true };
      if (st.status === 'failed') return { ok: false, reason: st.reason || JSON.stringify(st.err || {}) };
    }
    return { ok: null };
  }

  signBtn.addEventListener('click', async () => {
    signBtn.disabled = true;
    let signature = '';
    try {
      showStatus('Building transaction...', 'hint');
      const built = await api('build-tx', { wallet_address: connectedAddress });
      const mint_address = built.mint_address || '';
      const tx = (() => {
        const b = hexToBytes(built.unsigned_transaction);
        try { return Transaction.from(b); } catch (e) { return VersionedTransaction.deserialize(b); }
      })();

      showStatus((built.cost_text ? built.cost_text + '\n\n' : '') + 'Please review and approve in your wallet...', 'hint');
      if (!walletProvider) throw new Error('No Solana wallet connected. Reconnect your wallet.');

      if (typeof walletProvider.signAndSendTransaction === 'function') {
        const sent = await walletProvider.signAndSendTransaction(tx);
        const s = typeof sent === 'string' ? sent : (sent?.signature ?? sent?.txid ?? sent);
        signature = s instanceof Uint8Array ? base58(s) : String(s || '');
      } else if (typeof walletProvider.signTransaction === 'function') {
        const signed = await walletProvider.signTransaction(tx);
        const bytes = signed instanceof Uint8Array ? signed : txBytes(signed);
        showStatus('Signed. Sending to Solana...', 'hint');
        signature = (await api('sol-broadcast', { signed_tx_b64: bytesToB64(bytes) })).signature;
      } else {
        throw new Error('This wallet cannot sign Solana transactions here. Try another wallet from the list.');
      }
      if (!signature) throw new Error('The wallet did not return a transaction signature.');

      showStatus(`Sent. Waiting for Solana to confirm...<br><a href="${solscan(signature)}" target="_blank" rel="noopener">View on Solscan</a>`, 'hint', true);
      const res = await waitForConfirm(signature);
      if (res.ok === null) {
        showStatus(`Sent, but not confirmed after 90 seconds. Check it here before trying again:<br><a href="${solscan(signature)}" target="_blank" rel="noopener">View on Solscan</a>`, 'hint', true);
        signBtn.disabled = false;
        return;
      }
      if (!res.ok) throw new Error(`the launch failed on Solana — ${res.reason}`);

      await api('complete', { tx_hash: signature, result_token_address: mint_address || '' });
      showSuccess(signature);
    } catch (e) {
      showStatus(`Failed: ${e.message}`, 'error');
      signBtn.disabled = false;
      api('fail', { tx_hash: signature || String(e.message).slice(0, 300) }).catch(() => {});
    }
  });

  loadRequest();
</script>
</body>
</html>
