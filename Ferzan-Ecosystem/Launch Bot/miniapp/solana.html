<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Token</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000); padding: 16px; margin: 0; }
  button { width: 100%; padding: 14px; font-size: 16px; border-radius: 10px; border: none;
    margin-top: 12px; cursor: pointer; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  .primary { background: #f5f5f5; color: #111; border-radius: 8px; font-size: 14px; }
  .wallet-btn { display:flex; align-items:center; justify-content:center; gap:10px; background:#111; color:#fff; font-weight:600; }
  #status { margin-top: 16px; padding: 12px; border-radius: 8px; display:none; }
  .error { background: #fde8e8 !important; color: #a00; }
  .success { background: #e6f7e6 !important; color: #060; }
  .hint { background:#eef4fb !important; color:#1a5591; }
  .detail-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid #eee; }
  #walletChoices { display:none; margin-top:8px; }
  #successScreen { display:none; text-align:center; padding: 40px 16px; }
  #successScreen .check { font-size: 64px; line-height: 1; margin-bottom: 16px; }
  #successScreen h2 { margin: 0 0 12px; }
  #successScreen p { color: #555; font-size: 15px; line-height: 1.5; margin: 0 0 8px; }
  #successScreen .txlink { word-break: break-all; font-size: 12px; color: #888; margin-top: 12px; display:block; }
  #mainContent.hidden { display:none; }
</style>
</head>
<body>
<div id="mainContent">
<h2>Review Your Launch</h2>
<div id="details">Loading launch details...</div>
<div id="status"></div>

<button id="connectBtn" class="primary" style="display:none">Connect Wallet</button>

<div id="walletChoices">
  <button id="phantomBtn" class="wallet-btn">Continue with Phantom</button>
  <button id="solflareBtn" class="wallet-btn">Continue with Solflare</button>
</div>

<button id="signBtn" class="primary" style="display:none">Review & Sign Transaction</button>
</div>

<div id="successScreen">
  <div class="check">✅</div>
  <h2>Launch complete!</h2>
  <p>Your token was created and the transaction was confirmed on-chain.</p>
  <p><strong>You're all done here — you can close this page and go back to Telegram.</strong></p>
  <button id="closeBtn" class="primary">Close this window</button>
        <a id="returnBtn" href="https://t.me/FerzanLaunchBot" style="display:block;text-align:center;margin-top:12px;font-weight:600;color:#2481cc;text-decoration:none;">Return to Telegram</a>
  <span class="txlink" id="txlinkText"></span>
</div>

<script type="module">
  import { Transaction, VersionedTransaction } from 'https://esm.sh/@solana/web3.js@1?bundle';

  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const params = new URLSearchParams(window.location.search);
  const requestId = params.get('request_id');
  const API_BASE = 'https://launch.ferzaneco.com/api';

  const mainContent = document.getElementById('mainContent');
  const successScreen = document.getElementById('successScreen');
  const closeBtn = document.getElementById('closeBtn');
  const txlinkText = document.getElementById('txlinkText');
  const detailsEl = document.getElementById('details');
  const statusEl = document.getElementById('status');
  const connectBtn = document.getElementById('connectBtn');
  const signBtn = document.getElementById('signBtn');
  const walletChoices = document.getElementById('walletChoices');
  const phantomBtn = document.getElementById('phantomBtn');
  const solflareBtn = document.getElementById('solflareBtn');

  let connectedAddress = null;
  let walletProvider = null;

  function showStatus(text, kind) {
    statusEl.style.display = 'block';
    statusEl.textContent = text;
    statusEl.className = kind || '';
  }

  function showSuccess(signature) {
    mainContent.classList.add('hidden');
    successScreen.style.display = 'block';
    txlinkText.textContent = signature ? `Tx: ${signature}` : '';
  }

  closeBtn.addEventListener('click', () => {
    if (tg?.close) {
      tg.close();
    } else {
      try { window.close(); } catch (e) {}
    }
      setTimeout(() => { window.location.href = 'https://t.me/FerzanLaunchBot'; }, 300);
  });

  function hexToBytes(hex) {
    const raw = String(hex || '').replace(/^0x/i, '');
    const out = new Uint8Array(raw.length / 2);
    for (let i = 0; i < out.length; i++) out[i] = parseInt(raw.substr(i * 2, 2), 16);
    return out;
  }

  function getSolanaProvider() {
    if (window.phantom?.solana?.isPhantom) return window.phantom.solana;
    if (window.solflare?.isSolflare) return window.solflare;
    if (window.solana) return window.solana;
    return null;
  }

  function currentUrl() {
    return window.location.href;
  }

  function openInPhantom() {
    const url = currentUrl();
    const link = `https://phantom.app/ul/browse/${encodeURIComponent(url)}?ref=${encodeURIComponent(window.location.origin)}`;
    if (tg?.openLink) tg.openLink(link);
    else window.open(link, '_blank');
  }

  function openInSolflare() {
    const url = currentUrl();
    const link = `https://solflare.com/ul/v1/browse/${encodeURIComponent(url)}?ref=${encodeURIComponent(window.location.origin)}`;
    if (tg?.openLink) tg.openLink(link);
    else window.open(link, '_blank');
  }

  async function loadRequest() {
    if (!requestId) {
      detailsEl.textContent = 'Missing request ID -- open this from the bot, not directly.';
      return;
    }
    const res = await fetch(`${API_BASE}/launch-requests/${requestId}`);
    if (!res.ok) {
      detailsEl.textContent = 'Could not load launch details (may have expired).';
      return;
    }
    const req = await res.json();
    const extra = req.extra_params || {};
    const rows = [
      ['Name', req.name],
      ['Symbol', req.symbol],
      ['Chain', 'Solana'],
      ['Mode', req.mode],
      ['Supply', req.supply_display || req.total_supply],
    ];
    if (req.mode === 'meteora') rows.push(['Pool', 'Meteora bonding curve — fee on every trade']);
    if (extra.allocs) rows.push(['Team wallets', extra.allocs]);
    rows.push(['Fee', 'SOL launch fee bundled in the tx']);
    detailsEl.innerHTML = rows.map(([k, v]) =>
      `<div class="detail-row"><span>${k}</span><b>${String(v ?? '').slice(0, 80)}</b></div>`
    ).join('');

    const existing = getSolanaProvider();
    if (existing) {
      connectBtn.style.display = 'block';
    } else {
      showStatus('Choose your wallet to continue — it will open in the wallet\u2019s own browser.', 'hint');
      walletChoices.style.display = 'block';
    }
  }

  phantomBtn.addEventListener('click', openInPhantom);
  solflareBtn.addEventListener('click', openInSolflare);

  connectBtn.addEventListener('click', async () => {
    try {
      walletProvider = getSolanaProvider();
      if (!walletProvider) {
        showStatus('Choose your wallet to continue — it will open in the wallet\u2019s own browser.', 'hint');
        walletChoices.style.display = 'block';
        return;
      }
      const resp = await walletProvider.connect();
      connectedAddress = resp?.publicKey?.toString() || walletProvider.publicKey?.toString() || '';
      showStatus(`Connected: ${connectedAddress}`, 'success');
      connectBtn.style.display = 'none';
      walletChoices.style.display = 'none';
      signBtn.style.display = 'block';
    } catch (e) {
      showStatus(`Wallet connection failed: ${e.message}`, 'error');
    }
  });

  signBtn.addEventListener('click', async () => {
    try {
      showStatus('Building transaction...', 'hint');
      const buildRes = await fetch(`${API_BASE}/launch-requests/${requestId}/build-tx`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ wallet_address: connectedAddress }),
      });
      if (!buildRes.ok) {
        const err = await buildRes.json();
        throw new Error(err.detail || 'Failed to build transaction');
      }
      const built = await buildRes.json();
      const unsigned_transaction = built.unsigned_transaction;
      const mint_address = built.mint_address || '';

      const txBytes = hexToBytes(unsigned_transaction);
      let tx;
      try {
        tx = VersionedTransaction.deserialize(txBytes);
      } catch (e) {
        tx = Transaction.from(txBytes);
      }

      showStatus('Please review and approve in your wallet...', 'hint');
      if (!walletProvider) throw new Error('No Solana provider. Reconnect your wallet.');

      let sent;
      if (typeof walletProvider.signAndSendTransaction === 'function') {
        sent = await walletProvider.signAndSendTransaction(tx);
      } else if (typeof walletProvider.signTransaction === 'function') {
        await walletProvider.signTransaction(tx);
        throw new Error('Wallet signed but cannot send. Try Phantom or Solflare.');
      } else {
        throw new Error('This wallet does not support signAndSendTransaction.');
      }
      const signature = typeof sent === 'string' ? sent : (sent?.signature || sent?.txid || sent);

      await fetch(`${API_BASE}/launch-requests/${requestId}/complete`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tx_hash: signature, result_token_address: mint_address || '' }),
      });

      showSuccess(signature);
    } catch (e) {
      showStatus(`Failed: ${e.message}`, 'error');
      await fetch(`${API_BASE}/launch-requests/${requestId}/fail`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tx_hash: e.message }),
      }).catch(() => {});
    }
  });

  loadRequest();
</script>
</body>
</html>
