<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Token</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000); padding: 16px; margin: 0; }
  button { width: 100%; padding: 14px; font-size: 16px; border-radius: 10px; border: none;
    margin-top: 12px; cursor: pointer; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  .primary { background: #f5f5f5; color: #111; border-radius: 8px; font-size: 14px; }
  #status { margin-top: 16px; padding: 12px; border-radius: 8px; }
  .error { background: #fde8e8 !important; color: #a00; }
  .success { background: #e6f7e6 !important; color: #060; }
  .detail-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<h2>Review Your Launch</h2>
<div id="details">Loading launch details...</div>
<div id="status" style="display:none"></div>
<button id="connectBtn" class="primary" style="display:none">Connect Wallet</button>
<button id="browserBtn" class="primary" style="display:none;background:#111">Open in Safari / Chrome</button>
<button id="signBtn" class="primary" style="display:none">Review & Sign Transaction</button>

<script type="module">
  import { Transaction, VersionedTransaction } from 'https://esm.sh/@solana/web3.js@1?bundle';

  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const params = new URLSearchParams(window.location.search);
  const requestId = params.get('request_id');
  const API_BASE = 'https://launch.ferzaneco.com/api';

  const detailsEl = document.getElementById('details');
  const statusEl = document.getElementById('status');
  const connectBtn = document.getElementById('connectBtn');
  const signBtn = document.getElementById('signBtn');
  const browserBtn = document.getElementById('browserBtn');

  let connectedAddress = null;
  let walletProvider = null;

  function showStatus(text, kind) {
    statusEl.style.display = 'block';
    statusEl.textContent = text;
    statusEl.className = kind || '';
  }

  function hexToBytes(hex) {
    const raw = String(hex || '').replace(/^0x/i, '');
    const out = new Uint8Array(raw.length / 2);
    for (let i = 0; i < out.length; i++) out[i] = parseInt(raw.substr(i * 2, 2), 16);
    return out;
  }

  function getSolanaProvider() {
    if (window.phantom?.solana?.isPhantom) return window.phantom.solana;
    if (window.solflare?.isSolflare) return window.solflare;
    if (window.solana) return window.solana;
    return null;
  }

  async function loadRequest() {
    if (!requestId) {
      detailsEl.textContent = 'Missing request ID -- open this from the bot, not directly.';
      return;
    }
    const res = await fetch(`${API_BASE}/launch-requests/${requestId}`);
    if (!res.ok) {
      detailsEl.textContent = 'Could not load launch details (may have expired).';
      return;
    }
    const req = await res.json();
    const extra = req.extra_params || {};
    const rows = [
      ['Name', req.name],
      ['Symbol', req.symbol],
      ['Chain', 'Solana'],
      ['Mode', req.mode],
      ['Supply', req.supply_display || req.total_supply],
    ];
    if (req.mode === 'meteora') rows.push(['Pool', 'Meteora DBC coming soon — mint + fee today']);
    if (extra.allocs) rows.push(['Team wallets', extra.allocs]);
    rows.push(['Fee', 'SOL launch fee bundled in the tx']);
    detailsEl.innerHTML = rows.map(([k, v]) =>
      `<div class="detail-row"><span>${k}</span><b>${String(v ?? '').slice(0, 80)}</b></div>`
    ).join('');
    connectBtn.style.display = 'block';
  }

  connectBtn.addEventListener('click', async () => {
    try {
      walletProvider = getSolanaProvider();
      if (!walletProvider) {
        browserBtn.style.display = 'block';
        throw new Error('No Solana wallet found in this view. Tap "Open in Safari / Chrome" and connect there.');
      }
      const resp = await walletProvider.connect();
      connectedAddress = resp?.publicKey?.toString() || walletProvider.publicKey?.toString() || '';
      showStatus(`Connected: ${connectedAddress}`, 'success');
      connectBtn.style.display = 'none';
      signBtn.style.display = 'block';
    } catch (e) {
      showStatus(`Wallet connection failed: ${e.message}`, 'error');
    }
  });

  signBtn.addEventListener('click', async () => {
    try {
      showStatus('Building transaction...');
      const buildRes = await fetch(`${API_BASE}/launch-requests/${requestId}/build-tx`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ wallet_address: connectedAddress }),
      });
      if (!buildRes.ok) {
        const err = await buildRes.json();
        throw new Error(err.detail || 'Failed to build transaction');
      }
      const built = await buildRes.json();
      const unsigned_transaction = built.unsigned_transaction;
      const mint_address = built.mint_address || '';

      const txBytes = hexToBytes(unsigned_transaction);
      let tx;
      try {
        tx = VersionedTransaction.deserialize(txBytes);
      } catch (e) {
        tx = Transaction.from(txBytes);
      }

      showStatus('Please review and approve in your wallet...');
      if (!walletProvider) throw new Error('No Solana provider. Reconnect Phantom/Solflare.');

      let sent;
      if (typeof walletProvider.signAndSendTransaction === 'function') {
        sent = await walletProvider.signAndSendTransaction(tx);
      } else if (typeof walletProvider.signTransaction === 'function') {
        await walletProvider.signTransaction(tx);
        throw new Error('Provider signed but has no send. Use a wallet that supports signAndSendTransaction.');
      } else {
        throw new Error('Solana provider has no signAndSendTransaction.');
      }
      const signature = typeof sent === 'string' ? sent : (sent?.signature || sent?.txid || sent);

      await fetch(`${API_BASE}/launch-requests/${requestId}/complete`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tx_hash: signature, result_token_address: mint_address || '' }),
      });

      showStatus(`Launched. Tx: ${signature}`, 'success');
      signBtn.style.display = 'none';
      setTimeout(() => tg?.close(), 2500);
    } catch (e) {
      showStatus(`Failed: ${e.message}`, 'error');
      await fetch(`${API_BASE}/launch-requests/${requestId}/fail`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tx_hash: e.message }),
      }).catch(() => {});
    }
  });

  browserBtn?.addEventListener('click', () => {
    const url = window.location.href;
    if (tg?.openLink) tg.openLink(url);
    else window.open(url, '_blank');
  });

  loadRequest();
</script>
</body>
</html>
