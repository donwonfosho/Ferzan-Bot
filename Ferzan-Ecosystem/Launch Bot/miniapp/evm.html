<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Token</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; background: var(--tg-theme-bg-color, #fff);
         color: var(--tg-theme-text-color, #000); padding: 16px; margin: 0; }
  button { width: 100%; padding: 14px; font-size: 16px; border-radius: 10px; border: none;
           margin-top: 12px; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  .primary { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  .wallet-btn { background:#111; color:#fff; font-weight:600; margin-top:8px; }
  #status { margin-top: 16px; padding: 12px; border-radius: 8px; background: #f5f5f5; color:#111; font-size: 14px; line-height:1.4; word-break: break-word; }
  #status a { color: inherit; font-weight: 600; }
  .error { background: #fde8e8 !important; color: #a00 !important; }
  .success { background: #e6f7e6 !important; color: #060 !important; }
  .hint { background:#eef4fb !important; color:#1a5591 !important; }
  .detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 14px; border-bottom: 1px solid #eee; }
  .detail-row b { text-align: right; }
  #walletChoices .sub { font-size: 13px; color: #888; margin: 10px 0 2px; text-align:center; }
</style>
</head>
<body>
  <h2>Review Your Launch</h2>
  <div id="details">Loading launch details...</div>
  <div id="status" style="display:none"></div>
  <button id="connectBtn" class="primary" style="display:none">Connect Wallet</button>
  <div id="walletChoices" style="display:none;margin-top:8px">
    <div class="sub">Open this launch in your wallet app:</div>
    <button class="wallet-btn" data-wallet="metamask">MetaMask</button>
    <button class="wallet-btn" data-wallet="trust">Trust Wallet</button>
    <button class="wallet-btn" data-wallet="coinbase">Coinbase Wallet</button>
    <button class="wallet-btn" data-wallet="okx">OKX Wallet</button>
    <button class="wallet-btn" data-wallet="browser" style="background:#444">Open in Safari / Chrome</button>
  </div>
  <button id="signBtn" class="primary" style="display:none">Review & Sign Transaction</button>

<script type="module">
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const params = new URLSearchParams(window.location.search);
  const requestId = params.get('request_id');
  const API_BASE = 'https://launch.ferzaneco.com/api';

  const detailsEl = document.getElementById('details');
  const statusEl = document.getElementById('status');
  const connectBtn = document.getElementById('connectBtn');
  const signBtn = document.getElementById('signBtn');
  const walletChoices = document.getElementById('walletChoices');

  // Networks the Launch Bot supports, in the wallet's own format.
  const NETWORKS = {
    base:      { id: 8453, name: 'Base', sym: 'ETH', rpc: 'https://mainnet.base.org', explorer: 'https://basescan.org', trustCoin: 8453 },
    bsc:       { id: 56, name: 'BNB Chain', sym: 'BNB', rpc: 'https://bsc-dataseed.binance.org', explorer: 'https://bscscan.com', trustCoin: 20000714 },
    ethereum:  { id: 1, name: 'Ethereum', sym: 'ETH', rpc: 'https://ethereum.publicnode.com', explorer: 'https://etherscan.io', trustCoin: 60 },
    robinhood: { id: 4663, name: 'Robinhood Chain', sym: 'ETH', rpc: 'https://rpc.mainnet.chain.robinhood.com', explorer: '', trustCoin: 60 },
  };
  // Event ids used to find the new token in the receipt.
  const TOKEN_TOPIC = '0x1a8ab442384acdb09c73bc5f71549c099dad32203f07e1655e0ebce05831f749';
  const TRANSFER_TOPIC = '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
  const ZERO_TOPIC = '0x' + '0'.repeat(64);

  let launchReq = null;
  let net = null;
  let provider = null;
  let account = '';

  function showStatus(text, kind, html) {
    statusEl.style.display = 'block';
    if (html) statusEl.innerHTML = text; else statusEl.textContent = text;
    statusEl.className = kind || '';
  }
  function txLink(hash) { return net?.explorer ? `${net.explorer}/tx/${hash}` : ''; }
  function linkHtml(hash, label) {
    const u = txLink(hash);
    return u ? `<a href="${u}" target="_blank" rel="noopener">${label}</a>` : hash;
  }
  const hex = (n) => '0x' + BigInt(n).toString(16);
  function fmtSupply(raw, dec) {
    try {
      const d = BigInt(dec || 0), v = BigInt(String(raw));
      const whole = (d > 0n && v % (10n ** d) === 0n) ? v / (10n ** d) : v;
      return whole.toLocaleString('en-US');
    } catch (e) { return String(raw ?? ''); }
  }
  function fmtNative(wei) {
    const s = (Number(BigInt(wei)) / 1e18).toFixed(6).replace(/\.?0+$/, '');
    return `${s || '0'} ${net?.sym || ''}`;
  }

  // ---------- find a wallet inside this page (EIP-6963, then window.ethereum) ----------
  const announced = [];
  window.addEventListener('eip6963:announceProvider', (e) => { if (e?.detail?.provider) announced.push(e.detail); });
  window.dispatchEvent(new Event('eip6963:requestProvider'));
  async function findProvider() {
    await new Promise(r => setTimeout(r, 300));
    if (announced.length) return { p: announced[0].provider, name: announced[0].info?.name || 'Wallet' };
    if (window.ethereum) {
      const e = window.ethereum;
      const name = e.isMetaMask ? 'MetaMask' : e.isTrust || e.isTrustWallet ? 'Trust Wallet' : e.isCoinbaseWallet ? 'Coinbase Wallet' : e.isOkxWallet ? 'OKX Wallet' : 'Wallet';
      return { p: e, name };
    }
    if (window.okxwallet) return { p: window.okxwallet, name: 'OKX Wallet' };
    return null;
  }

  function walletLink(id) {
    const url = window.location.href;
    const u = encodeURIComponent(url);
    switch (id) {
      case 'metamask': return 'https://metamask.app.link/dapp/' + url.replace(/^https?:\/\//, '');
      case 'trust': return `https://link.trustwallet.com/open_url?coin_id=${net?.trustCoin || 60}&url=${u}`;
      case 'coinbase': return `https://go.cb-w.com/dapp?cb_url=${u}`;
      case 'okx': return 'https://web3.okx.com/download?deeplink=' + encodeURIComponent('okx://wallet/dapp/url?dappUrl=' + u);
      case 'browser': return url;
    }
    return null;
  }
  walletChoices.querySelectorAll('[data-wallet]').forEach(btn => btn.addEventListener('click', () => {
    const link = walletLink(btn.dataset.wallet);
    if (link) { if (tg?.openLink) tg.openLink(link); else window.open(link, '_blank'); }
  }));
  function showWalletChoices() {
    showStatus('Choose your wallet — this launch opens inside that wallet’s app so it can sign.', 'hint');
    walletChoices.style.display = 'block';
  }

  // ---------- review screen ----------
  async function loadRequest() {
    if (!requestId) { detailsEl.textContent = 'Missing request ID -- open this from the bot, not directly.'; return; }
    const res = await fetch(`${API_BASE}/launch-requests/${requestId}`);
    if (!res.ok) { detailsEl.textContent = 'Could not load launch details (may have expired).'; return; }
    launchReq = await res.json();
    net = NETWORKS[launchReq.chain] || null;
    const extra = launchReq.extra_params || {};
    const curve = launchReq.mode === 'bonding_curve';
    const rows = [
      ['Name', launchReq.name],
      ['Symbol', launchReq.symbol],
      ['Chain', net ? net.name : launchReq.chain],
      ['Mode', curve ? 'Bonding curve' : 'Standard token'],
      ['Supply', launchReq.supply_display || fmtSupply(launchReq.total_supply, launchReq.decimals)],
    ];
    if (extra.allocs_display || extra.allocs) rows.push(['Team wallets', extra.allocs_display || extra.allocs]);
    const sym = net ? net.sym : '';
    if (curve) {
      if (extra.graduation_display) rows.push(['Graduates at', extra.graduation_display]);
      rows.push(['Dev buy', Number(extra.dev_buy || 0) > 0 ? `${extra.dev_buy} ${sym}` : 'none']);
      const mins = Number(extra.start_minutes || 0);
      rows.push(['Trading opens', extra.start_at
        ? new Date(Number(extra.start_at) * 1000).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
        : (extra.start_display || (mins > 0 ? `${mins} min after launch` : 'right away'))]);
      if (launchReq.image_url) rows.push(['Logo', '✅ added']);
      if (extra.website || extra.x || extra.telegram) rows.push(['Links', [['website', 'Website'], ['x', 'X'], ['telegram', 'Telegram']].filter(([k]) => extra[k]).map(([, n]) => n).join(', ')]);
      rows.push(['Max buy', Number(extra.max_buy || 0) > 0 ? `${extra.max_buy} ${sym} per wallet` : 'no limit']);
      rows.push(['Token', 'Fixed supply · no owner · pool liquidity burned at graduation']);
      if (extra.allocs) rows.push(['Team tokens', 'locked until the curve graduates']);
      rows.push(['Cost', 'Launch fee + dev buy + gas, shown before you sign']);
    } else {
      rows.push(['Token', 'Fixed supply · no owner · can never be minted again']);
      rows.push(['Cost', 'Launch fee + network gas, shown in your wallet']);
    }
    detailsEl.innerHTML = rows.map(([k, v]) =>
      `<div class="detail-row"><span>${k}</span><b>${String(v ?? '').replace(/</g, '&lt;').slice(0, 90)}</b></div>`
    ).join('');
    if (!net) { showStatus(`Launches on ${launchReq.chain} aren't available yet.`, 'error'); return; }
    const found = await findProvider();
    if (found) { connectBtn.textContent = `Connect ${found.name}`; connectBtn.style.display = 'block'; }
    else showWalletChoices();
  }

  async function ensureNetwork() {
    const want = hex(net.id);
    const onNet = async () => { try { return Number(BigInt(await provider.request({ method: 'eth_chainId' }))) === net.id; } catch (e) { return false; } };
    if (await onNet()) return;
    showStatus(`Switching your wallet to ${net.name}...`, 'hint');
    try {
      await provider.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: want }] });
    } catch (e) {
      if (e?.code === 4902 || /unrecognized|not added|unknown chain/i.test(e?.message || '')) {
        await provider.request({ method: 'wallet_addEthereumChain', params: [{
          chainId: want, chainName: net.name, rpcUrls: [net.rpc],
          nativeCurrency: { name: net.sym, symbol: net.sym, decimals: 18 },
          blockExplorerUrls: net.explorer ? [net.explorer] : [],
        }] });
      } else {
        throw new Error(`please switch your wallet to ${net.name} and try again`);
      }
    }
    for (let i = 0; i < 16; i++) { if (await onNet()) return; await new Promise(r => setTimeout(r, 500)); }
    throw new Error(`your wallet didn't switch — open the network menu in your wallet, pick ${net.name}, then tap Connect again`);
  }

  connectBtn.addEventListener('click', async () => {
    try {
      const found = await findProvider();
      if (!found) { showWalletChoices(); return; }
      provider = found.p;
      const accts = await provider.request({ method: 'eth_requestAccounts' });
      account = (accts || [])[0] || '';
      if (!account) throw new Error('the wallet did not share an address');
      await ensureNetwork();
      showStatus(`Connected: ${account} (${net.name})`, 'success');
      connectBtn.style.display = 'none';
      walletChoices.style.display = 'none';
      signBtn.style.display = 'block';
    } catch (e) {
      showStatus(`Wallet connection failed: ${e.message}`, 'error');
    }
  });

  async function api(path, body) {
    const r = await fetch(`${API_BASE}/launch-requests/${requestId}/${path}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}),
    });
    let data = {};
    try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(data.detail || `server error ${r.status}`);
    return data;
  }

  async function getReceipt(hash, rpcUrl) {
    try {
      const rc = await provider.request({ method: 'eth_getTransactionReceipt', params: [hash] });
      if (rc) return rc;
    } catch (e) {}
    const url = rpcUrl || net.rpc;
    try {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_getTransactionReceipt', params: [hash] }) });
      return (await r.json()).result || null;
    } catch (e) { return null; }
  }

  function tokenFromReceipt(rc) {
    for (const log of rc.logs || []) {
      const t = (log.topics || []).map(x => String(x).toLowerCase());
      if (t[0] === TOKEN_TOPIC && t[1]) return '0x' + t[1].slice(-40);
    }
    // fallback: the new token's first Transfer is a mint (from = 0x0)
    for (const log of rc.logs || []) {
      const t = (log.topics || []).map(x => String(x).toLowerCase());
      if (t[0] === TRANSFER_TOPIC && t[1] === ZERO_TOPIC) return log.address;
    }
    return '';
  }

  const CURVE_TOPIC = '0x188ae4cd8aa7c0376e9501e76fb7a19dd1454add5c88bffbf75f391807a14475';
  function curveFromReceipt(rc) {
    for (const log of rc.logs || []) {
      const t = (log.topics || []).map(x => String(x).toLowerCase());
      if (t[0] === CURVE_TOPIC && t[1]) return '0x' + t[1].slice(-40);
    }
    return '';
  }

  signBtn.addEventListener('click', async () => {
    signBtn.disabled = true;
    let hash = '';
    try {
      await ensureNetwork();
      showStatus('Building transaction...', 'hint');
      const built = await api('build-tx', { wallet_address: account });
      const tx = built.unsigned_transaction || {};
      if (Number(tx.chainId || net.id) !== net.id) throw new Error('the launch was built for a different network');
      const fee = BigInt(String(tx.value || 0));
      const devWei = BigInt(String(tx.dev_buy_wei || 0));
      const feeWei = tx.launch_fee_wei != null ? BigInt(String(tx.launch_fee_wei)) : fee - devWei;
      const costTxt = devWei > 0n
        ? `${fmtNative(fee)} total (${fmtNative(feeWei)} launch fee + ${fmtNative(devWei)} dev buy)`
        : `the ${fmtNative(fee)} launch fee`;
      showStatus(`You'll pay ${costTxt} + network gas.\n\nPlease review and approve in your wallet...`, 'hint');
      const req = { from: account, to: tx.to, data: tx.data, value: hex(fee) };
      if (tx.gas) req.gas = hex(tx.gas);
      hash = await provider.request({ method: 'eth_sendTransaction', params: [req] });
      if (!hash) throw new Error('the wallet did not return a transaction hash');

      showStatus(`Sent. Waiting for ${net.name} to confirm...<br>${linkHtml(hash, 'View transaction')}`, 'hint', true);
      let rc = null;
      const until = Date.now() + 120000;
      while (!rc && Date.now() < until) {
        await new Promise(r => setTimeout(r, 2500));
        rc = await getReceipt(hash, built.rpc_url);
      }
      if (!rc) {
        showStatus(`Sent, but not confirmed after 2 minutes. Check it before trying again:<br>${linkHtml(hash, 'View transaction')}`, 'hint', true);
        signBtn.disabled = false;
        return;
      }
      if (String(rc.status) !== '0x1' && String(rc.status) !== '1') {
        throw new Error('the launch transaction failed on-chain (nothing was created)');
      }
      const token = tokenFromReceipt(rc);
      const curveAddr = curveFromReceipt(rc);
      await api('complete', { tx_hash: hash, result_token_address: token || '', curve_address: curveAddr || '' });
      const tokenLink = token && net.explorer ? `<br><a href="${net.explorer}/token/${token}" target="_blank" rel="noopener">View your token</a>` : '';
      const tradeUrl = curveAddr ? new URL(`curve.html?chain=${launchReq.chain}&curve=${curveAddr}`, location.href).href : '';
      const tradeLink = tradeUrl ? `<br><a href="${tradeUrl}">📈 Open the trade page</a>` : '';
      showStatus(`✅ Launched on ${net.name}!${tradeLink}${tokenLink}<br>${linkHtml(hash, 'View transaction')}`, 'success', true);
      signBtn.style.display = 'none';
    } catch (e) {
      let msg = e?.code === 4001 ? 'you rejected the request in your wallet' : (e?.message || String(e));
      const lack = /insufficient funds[\s\S]*?have (\d+) want (\d+)/i.exec(msg);
      if (lack) msg = `not enough ${net.sym} in this wallet. It has ${fmtNative(lack[1])} but the launch needs ${fmtNative(lack[2])} (launch fee) plus a little for gas. Add ${net.sym} on ${net.name} and tap the button again.`;
      else if (/insufficient funds/i.test(msg)) msg = `not enough ${net.sym} in this wallet for the launch fee + gas. Add ${net.sym} on ${net.name} and try again.`;
      showStatus(`Failed: ${msg}`, 'error');
      signBtn.disabled = false;
      api('fail', { tx_hash: hash || msg.slice(0, 300) }).catch(() => {});
    }
  });

  loadRequest();
</script>
</body>
</html>
