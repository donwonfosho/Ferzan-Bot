<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Token</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; background: var(--tg-theme-bg-color, #fff);
         color: var(--tg-theme-text-color, #000); padding: 16px; margin: 0; }
  button { width: 100%; padding: 14px; font-size: 16px; border-radius: 10px; border: none;
            margin-top: 12px; cursor: pointer; }
  .primary { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  #status { margin-top: 16px; padding: 12px; border-radius: 8px; background: #f5f5f5; font-size: 14px; }
  .error { background: #fde8e8 !important; color: #a00; }
  .success { background: #e6f7e6 !important; color: #060; }
  .detail-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
  <h2>Review Your Launch</h2>
  <div id="details">Loading launch details...</div>
  <div id="status" style="display:none"></div>
  <button id="connectBtn" class="primary" style="display:none">Connect Wallet</button>
  <button id="signBtn" class="primary" style="display:none">Review & Sign Transaction</button>

<script type="module">
  /*
    ============================================================
    CONFIDENCE NOTE (updated after verifying against Reown's live docs)
    ============================================================
    This rewrite follows the ACTUAL current example code from
    docs.reown.com (found via search during development, not assumed) --
    createAppKit + WagmiAdapter is Reown's own documented "quick
    integration" path, meaningfully more likely to be correct than a
    guessed Ethers-adapter approach. Still genuinely untested: no
    browser, no real wallet, no real RPC endpoint touched this code.
    Test against a real Reown Project ID and a real testnet wallet
    before trusting any of it.

    TESTNET config below -- Sepolia / BSC testnet / Base Sepolia.
    Robinhood Chain testnet needs a CUSTOM network definition since it
    won't be in @reown/appkit/networks' predefined list (too new) --
    see the robinhoodTestnet object below, built with viem's defineChain
    per Reown's documented "custom networks" pattern. Confirm the RPC
    URL and chain ID against docs.robinhood.com/chain before relying on it.
  */

  import { createAppKit } from 'https://esm.sh/@reown/appkit@1?bundle';
  import { WagmiAdapter } from 'https://esm.sh/@reown/appkit-adapter-wagmi@1?bundle';
  import { sepolia, bscTestnet, baseSepolia } from 'https://esm.sh/@reown/appkit/networks@1?bundle';
  import { defineChain } from 'https://esm.sh/viem@2?bundle';
  import { getAccount, sendTransaction } from 'https://esm.sh/@wagmi/core@2?bundle';

  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const params = new URLSearchParams(window.location.search);
  const requestId = params.get('request_id');
  const API_BASE = 'https://yourdomain.com/api'; // set to your deployed backend

  const detailsEl = document.getElementById('details');
  const statusEl = document.getElementById('status');
  const connectBtn = document.getElementById('connectBtn');
  const signBtn = document.getElementById('signBtn');

  const PROJECT_ID = 'YOUR_REOWN_PROJECT_ID'; // free from dashboard.reown.com

  // Custom network definition for Robinhood Chain testnet -- verified
  // chain ID (46630) during project research; confirm RPC URL is still
  // current before use.
  const robinhoodTestnet = defineChain({
    id: 46630,
    name: 'Robinhood Chain Testnet',
    nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
    rpcUrls: { default: { http: ['https://rpc.testnet.chain.robinhood.com'] } },
  });

  const CHAIN_NETWORK_MAP = {
    ethereum: sepolia,       // TESTNET stand-in for mainnet Ethereum during live testing
    bsc: bscTestnet,
    base: baseSepolia,
    robinhood: robinhoodTestnet,
  };

  let launchRequest = null;
  let wagmiAdapter = null;

  function showStatus(text, kind) {
    statusEl.style.display = 'block';
    statusEl.textContent = text;
    statusEl.className = kind || '';
  }

  async function loadRequest() {
    if (!requestId) {
      detailsEl.textContent = 'Missing request ID -- open this from the bot, not directly.';
      return;
    }
    const res = await fetch(`${API_BASE}/launch-requests/${requestId}`);
    if (!res.ok) {
      detailsEl.textContent = 'Could not load launch details (may have expired).';
      return;
    }
    launchRequest = await res.json();
    detailsEl.innerHTML = `
      <div class="detail-row"><span>Name</span><b>${launchRequest.name}</b></div>
      <div class="detail-row"><span>Symbol</span><b>${launchRequest.symbol}</b></div>
      <div class="detail-row"><span>Chain</span><b>${launchRequest.chain} (testnet)</b></div>
      <div class="detail-row"><span>Mode</span><b>${launchRequest.mode}</b></div>
    `;
    connectBtn.style.display = 'block';
  }

  function initAppKit() {
    const network = CHAIN_NETWORK_MAP[launchRequest.chain];
    if (!network) throw new Error(`No testnet configured for chain: ${launchRequest.chain}`);

    wagmiAdapter = new WagmiAdapter({
      projectId: PROJECT_ID,
      networks: [network],
    });

    createAppKit({
      adapters: [wagmiAdapter],
      networks: [network],
      projectId: PROJECT_ID,
      metadata: {
        name: 'Launch Bot',
        description: 'Launch a token',
        url: window.location.origin,
        icons: [],
      },
    });
  }

  connectBtn.addEventListener('click', async () => {
    try {
      initAppKit();
      // AppKit renders its own connect modal automatically once
      // initialized in most setups -- if it doesn't auto-open, the
      // documented trigger is a <appkit-button> web component or
      // `modal.open()` on the object createAppKit returns. Verify
      // which applies to the version you install.
      showStatus('Opening wallet connection...');

      // Poll for connection via @wagmi/core -- this is the documented
      // way to read connection state (not a method on the appkit
      // instance itself, per Reown's own contract-interaction example).
      const account = await waitForConnection();
      showStatus(`Connected: ${account.address}`, 'success');
      connectBtn.style.display = 'none';
      signBtn.style.display = 'block';
    } catch (e) {
      showStatus(`Wallet connection failed: ${e.message}`, 'error');
    }
  });

  function waitForConnection(timeoutMs = 120000) {
    return new Promise((resolve, reject) => {
      const start = Date.now();
      const interval = setInterval(() => {
        const account = getAccount(wagmiAdapter.wagmiConfig);
        if (account.isConnected) {
          clearInterval(interval);
          resolve(account);
        } else if (Date.now() - start > timeoutMs) {
          clearInterval(interval);
          reject(new Error('Wallet connection timed out'));
        }
      }, 500);
    });
  }

  signBtn.addEventListener('click', async () => {
    try {
      const account = getAccount(wagmiAdapter.wagmiConfig);
      showStatus('Building transaction...');
      const buildRes = await fetch(`${API_BASE}/launch-requests/${requestId}/build-tx`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ wallet_address: account.address }),
      });
      if (!buildRes.ok) {
        const err = await buildRes.json();
        throw new Error(err.detail || 'Failed to build transaction');
      }
      const { unsigned_transaction } = await buildRes.json();

      showStatus('Please review and approve in your wallet...');
      // Field-name mapping: web3.py's build_transaction dict uses `gas`
      // and `gasPrice` -- confirm this against a real built transaction
      // before trusting it; `chainId` in particular may need handling
      // as a separate top-level option depending on the exact
      // @wagmi/core version, since the connected network already
      // implies it in most setups.
      const hash = await sendTransaction(wagmiAdapter.wagmiConfig, {
        to: unsigned_transaction.to,
        value: BigInt(unsigned_transaction.value || 0),
        data: unsigned_transaction.data,
        gas: unsigned_transaction.gas ? BigInt(unsigned_transaction.gas) : undefined,
      });

      showStatus('Transaction submitted, waiting for confirmation...');

      await fetch(`${API_BASE}/launch-requests/${requestId}/complete`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tx_hash: hash, result_token_address: '' }),
      });

      showStatus(`✅ Launched! Tx: ${hash}`, 'success');
      signBtn.style.display = 'none';
      setTimeout(() => tg?.close(), 2500);

    } catch (e) {
      showStatus(`Failed: ${e.message}`, 'error');
      await fetch(`${API_BASE}/launch-requests/${requestId}/fail`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tx_hash: e.message }),
      }).catch(() => {});
    }
  });

  loadRequest();
</script>
</body>
</html>
